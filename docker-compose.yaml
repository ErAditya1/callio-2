services:
  callio-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}"
        BACKEND_URL: "${BACKEND_URL:-http://localhost:8000}"
    container_name: callio-frontend
    restart: always
    environment:
      NODE_ENV: "production"
      PORT: "3010"
      BACKEND_URL: "${BACKEND_URL:-http://localhost:8000}"
      NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}"
    ports:
      - "${FRONTEND_PORT:-3010}:3010"
